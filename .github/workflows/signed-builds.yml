name: Signed builds

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: verify
    runs-on: windows-latest
    env:
      WINDOWS_PFX_B64: ${{ secrets.WINDOWS_PFX_B64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      GIPHY_WINDOWS_KEY: ${{ secrets.GIPHY_WINDOWS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Validate build secrets
        shell: pwsh
        run: |
          foreach ($name in @('WINDOWS_PFX_B64', 'WINDOWS_PFX_PASSWORD', 'SUPABASE_URL', 'SUPABASE_PUBLISHABLE_KEY', 'GIPHY_WINDOWS_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing repository secret: $name" }
          }
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release --build-number=${{ github.run_number }} `
            --dart-define="SUPABASE_URL=$env:SUPABASE_URL" `
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY" `
            --dart-define="GIPHY_WINDOWS_KEY=$env:GIPHY_WINDOWS_KEY"
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
      - name: Sign and verify Windows binaries
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'memlib-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_B64))
          $signtool = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found' }
          $binaries = @(Get-ChildItem -LiteralPath 'build\windows\x64\runner\Release' -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll') })
          if ($binaries.Count -eq 0) { throw 'No Windows binaries were found' }
          foreach ($binary in $binaries) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com $binary.FullName
            if ($LASTEXITCODE -ne 0) { throw "Windows signing failed: $($binary.Name)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $binary.FullName
            if (-not $signature.SignerCertificate -or $signature.SignatureType -ne 'Authenticode') { throw "Missing Authenticode signature: $($binary.Name)" }
          }
          Write-Output "Signed and checked $($binaries.Count) Windows binaries"
          Remove-Item -LiteralPath $pfx
      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'MemLib-Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MemLib-Windows-${{ github.run_number }}
          path: MemLib-Windows.zip
          retention-days: 30
          if-no-files-found: error

  android:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: verify
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      GIPHY_ANDROID_KEY: ${{ secrets.GIPHY_ANDROID_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Restore Android signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD SUPABASE_URL SUPABASE_PUBLISHABLE_KEY GIPHY_ANDROID_KEY; do
            if [[ -z "${!name:-}" ]]; then echo "Missing repository secret: $name" >&2; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/memlib-upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/memlib-upload.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties
          chmod 600 "$RUNNER_TEMP/memlib-upload.jks" android/key.properties
      - run: flutter pub get
      - name: Build signed Android APK and App Bundle
        shell: bash
        run: |
          set -euo pipefail
          defines=(
            "--dart-define=SUPABASE_URL=$SUPABASE_URL"
            "--dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            "--dart-define=GIPHY_ANDROID_KEY=$GIPHY_ANDROID_KEY"
          )
          flutter build apk --release --build-number=${{ github.run_number }} "${defines[@]}"
          flutter build appbundle --release --build-number=${{ github.run_number }} "${defines[@]}"
      - name: Verify Android signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then echo 'apksigner was not found' >&2; exit 1; fi
          "$apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: MemLib-Android-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
